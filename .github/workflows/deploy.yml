name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install API dependencies
        run: npm ci --legacy-peer-deps

      # Gate sebelum apa pun menyentuh production: typecheck + suite keamanan
      # (matriks otorisasi, isolasi divisi, rate limit, kebocoran error).
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install panel dependencies
        run: npm ci --legacy-peer-deps
        working-directory: panel

      - name: Build admin panel
        run: npm run build
        working-directory: panel

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply bph-cms-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Guard: ALLOW_DEV_AUTH tidak boleh pernah ter-set di config yang di-deploy.
      # Dev-auth juga diguard runtime (localhost-only) di src/middlewares/admin-auth.ts.
      - name: Guard ALLOW_DEV_AUTH off
        run: |
          if grep -qiE '"ALLOW_DEV_AUTH"' wrangler.jsonc wrangler.toml 2>/dev/null; then
            echo "::error::ALLOW_DEV_AUTH found in wrangler config — must never be set for deploys"
            exit 1
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
